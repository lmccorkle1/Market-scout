name: Market Scout Daily Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/scan.py"
      - ".github/workflows/daily-scan.yml"
  schedule:
    # 22:15 UTC is after the US close in both standard and daylight time.
    - cron: "15 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-scout-daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install free-data dependencies
        run: python -m pip install --disable-pip-version-check "pandas<3" "lxml<7" "yfinance<1"

      - name: Build verified scan
        run: python scripts/scan.py

      - name: Publish changed scan data
        run: |
          if git diff --quiet -- data/scanner.json; then
            echo "No scan-data change to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scanner.json
          git commit -m "Update Market Scout daily scan"
          git push
